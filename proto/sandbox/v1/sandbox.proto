//
// The harness/sandbox boundary: the OpenAI Agents SDK harness calls this service
// on its paired sandbox worker. Each session runs in its own microVM (microsandbox)
// that sees only that session's workspace. The worker holds the application-scoped
// Kubernetes identity; the harness holds the model credentials. Neither crosses
// this boundary.
//
// Errors use gRPC status codes: INVALID_ARGUMENT for bad session IDs or paths
// that leave the workspace, NOT_FOUND for a missing session, file or evidence
// entry, RESOURCE_EXHAUSTED for a file over the size limit, UNAUTHENTICATED for
// a missing or wrong worker token, UNAVAILABLE when the session's VM cannot be
// started or reached. A command's nonzero exit or timeout is a normal ExecResponse.

syntax = "proto3";

package sandbox.v1;

service Sandbox {
  // What this worker is: its identity, isolation, limits and egress policy.
  rpc Info(InfoRequest) returns (InfoResponse);
  // Create the session's workspace, or confirm it still exists. Idempotent.
  rpc InitSession(InitSessionRequest) returns (InitSessionResponse);
  // Run one command in the session's VM, starting the VM if it is not running.
  rpc Exec(ExecRequest) returns (ExecResponse);
  // File I/O inside the session's workspace, without a shell command.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // Cluster reads the worker recorded as evidence, from its own journal that
  // no VM can see.
  rpc ListEvidence(ListEvidenceRequest) returns (ListEvidenceResponse);
  rpc ReadEvidence(ReadEvidenceRequest) returns (ReadEvidenceResponse);
  // A pod's log, through the worker's log policy: the caller gets a bounded,
  // redacted excerpt of the lines that matter, never the raw log. VMs cannot
  // read logs at all; the worker's API proxy refuses them. The excerpt is
  // recorded as evidence and saved in the session's workspace.
  rpc ReadLogs(ReadLogsRequest) returns (ReadLogsResponse);
  // A health summary of the workloads in the worker's namespaces, for the UI:
  // pod status, restarts, waiting reasons and recent warning events. No logs,
  // and nothing here goes to the model.
  rpc Health(HealthRequest) returns (HealthResponse);
  // Remove the session's VM and workspace. The audit journal stays unless purged.
  rpc DestroySession(DestroySessionRequest) returns (DestroySessionResponse);
}

message InfoRequest {}

message InfoResponse {
  string worker_id = 1;          // pod name
  string domain = 2;             // application domain this worker serves
  string isolation = 3;          // e.g. "microVM per session (1 vCPU, 768 MiB)"
  string runtime_version = 4;    // e.g. "microsandbox 0.7.13"
  string egress = 5;             // e.g. "kube-api only (10.96.0.1:443)"
  uint32 active_sessions = 6;
  uint64 max_file_bytes = 7;
  string workspace_base = 8;     // sessions live at <workspace_base>/<session_id>
  repeated string namespaces = 9; // namespaces the worker's identity may read
}

message InitSessionRequest {
  string session_id = 1;
}

message InitSessionResponse {
  string workspace_root = 1;     // the same path inside and outside the VM
  bool created = 2;              // false when the workspace already existed
}

message ExecRequest {
  string session_id = 1;
  repeated string argv = 2;      // run as given; use ["sh", "-lc", "..."] for a shell
  string cwd = 3;                // inside the workspace; defaults to its root
  uint32 timeout_ms = 4;         // defaults to the worker's limit, never above it
  string requester = 5;          // who asked for the turn, as the client knows them; recorded in the journal
}

message ExecResponse {
  bytes stdout = 1;              // redacted, then capped
  bytes stderr = 2;
  int32 exit_code = 3;
  bool timed_out = 4;
  uint32 duration_ms = 5;
  bool truncated = 6;
  string evidence_path = 7;      // set when the command was recorded as evidence
}

message WriteFileRequest {
  string session_id = 1;
  string path = 2;               // absolute under the workspace root, or relative to it
  bytes content = 3;
}

message WriteFileResponse {
  uint64 bytes_written = 1;
}

message ReadFileRequest {
  string session_id = 1;
  string path = 2;
  uint64 max_bytes = 3;          // 0: the whole file, refused above the worker's limit
}

message ReadFileResponse {
  bytes content = 1;
  uint64 size = 2;               // the file's full size
}

message Evidence {
  uint32 seq = 1;
  string path = 2;               // the workspace copy, e.g. evidence/003-kubectl-get-pods.txt
  string command = 3;            // the kubectl command as run
  string sha256 = 4;             // of the recorded (redacted) output
  uint64 bytes = 5;
  int32 exit_code = 6;
  string recorded_at = 7;        // RFC 3339
}

message ListEvidenceRequest {
  string session_id = 1;
  uint32 after_seq = 2;
}

message ListEvidenceResponse {
  repeated Evidence entries = 1;
}

message ReadEvidenceRequest {
  string session_id = 1;
  uint32 seq = 2;
}

message ReadEvidenceResponse {
  Evidence entry = 1;
  bytes content = 2;
}

message ReadLogsRequest {
  string session_id = 1;
  string namespace = 2;          // must be one the worker serves
  string pod = 3;
  string container = 4;          // optional
  bool previous = 5;             // the last terminated container
  uint32 tail_lines = 6;         // lines to read from the end; capped by the worker
  uint32 since_seconds = 7;      // optional
  string match = 8;              // optional literal text to look for, case-insensitive
  string requester = 9;          // who asked for the turn; recorded in the journal
}

message ReadLogsResponse {
  string excerpt = 1;            // what the policy lets through, with a header saying what it withheld
  string evidence_path = 2;      // the workspace copy, e.g. evidence/004-pod-logs-checkout-1.txt
  uint32 lines_read = 3;
  uint32 lines_shown = 4;
  uint32 lines_withheld = 5;
  uint32 redactions = 6;
}

message HealthRequest {}

message ImageChange {
  string container = 1;
  string from = 2;
  string to = 3;
}

message Rollout {
  uint32 revision = 1;           // the deployment's newest revision
  string at = 2;                 // when its ReplicaSet was created
  repeated string images = 3;
  uint32 previous_revision = 4;  // 0: no earlier revision is kept
  repeated ImageChange changed = 5;
}

message WorkloadEvent {
  string type = 1;               // Normal or Warning
  string reason = 2;
  string message = 3;            // redacted
  string at = 4;
}

message Workload {
  string namespace = 1;
  string kind = 2;               // Deployment, StatefulSet or Pod
  string name = 3;
  uint32 desired = 4;
  uint32 ready = 5;
  uint32 restarts = 6;
  string state = 7;              // failing, degraded or healthy
  repeated string reasons = 8;   // e.g. CrashLoopBackOff, "last exit: Error (code 1)"
  uint32 warnings = 9;           // warning events in the last hour
  string last_warning = 10;      // redacted
  string last_warning_at = 11;
  string waiting_message = 12;   // the kubelet's own words, redacted, e.g. the registry's reply to a pull
  repeated WorkloadEvent events = 13; // the latest few in the last hour, of any type
  Rollout rollout = 14;          // a Deployment's latest rollout; unset for others
}

message NamespaceHealth {
  string namespace = 1;
  repeated Workload workloads = 2;
  string error = 3;
}

message HealthResponse {
  string generated_at = 1;
  repeated NamespaceHealth namespaces = 2;
}

message DestroySessionRequest {
  string session_id = 1;
  bool purge_history = 2;
}

message DestroySessionResponse {
  bool existed = 1;
}
