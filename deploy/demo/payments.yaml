# The payments application, broken two ways for the SRE agent to investigate:
# payments-processor exits at startup without DATABASE_URL (CrashLoopBackOff),
# payments-ledger names an image tag that was never published (ImagePullBackOff),
# and payments-gateway is healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-processor
  namespace: payments
  labels: {app: payments-processor}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments-processor}}
  template:
    metadata: {labels: {app: payments-processor}}
    spec:
      containers:
        - name: processor
          image: busybox:1.37.0
          env:
            - {name: REDIS_HOST, value: payments-redis.payments.svc}
          command:
            - sh
            - -c
            - |
              echo "payments-processor 3.2.0 starting"
              echo "connecting to idempotency cache at $REDIS_HOST"
              echo "[FATAL] Payments startup failed: Missing required env var DATABASE_URL" >&2
              exit 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-ledger
  namespace: payments
  labels: {app: payments-ledger}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments-ledger}}
  template:
    metadata: {labels: {app: payments-ledger}}
    spec:
      containers:
        - name: ledger
          image: busybox:1.37.0-payments-ledger-2.4.1
          command: ["sh", "-c", "exec sleep 2147483647"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-gateway
  namespace: payments
  labels: {app: payments-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: payments-gateway}}
  template:
    metadata: {labels: {app: payments-gateway}}
    spec:
      containers:
        - name: gateway
          image: busybox:1.37.0
          command: ["sh", "-c", "echo 'payments-gateway 1.9.4 serving on :8080'; exec sleep 2147483647"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
