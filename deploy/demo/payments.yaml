# The payments application, broken two ways for the SRE agent to investigate:
# payments-processor exits at startup without DATABASE_URL (CrashLoopBackOff),
# payments-ledger names an image tag that was never published (ImagePullBackOff),
# and payments-gateway is healthy. payments-api is running but logs a customer's
# email and card number on every request and an upstream timeout every 200
# requests: its log must reach the model only as a masked excerpt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-processor
  namespace: payments
  labels: {app: payments-processor}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments-processor}}
  template:
    metadata: {labels: {app: payments-processor}}
    spec:
      containers:
        - name: processor
          image: busybox:1.37.0
          env:
            - {name: REDIS_HOST, value: payments-redis.payments.svc}
          command:
            - sh
            - -c
            - |
              echo "payments-processor 3.2.0 starting"
              echo "connecting to idempotency cache at $REDIS_HOST"
              echo "[FATAL] Payments startup failed: Missing required env var DATABASE_URL" >&2
              exit 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-ledger
  namespace: payments
  labels: {app: payments-ledger}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments-ledger}}
  template:
    metadata: {labels: {app: payments-ledger}}
    spec:
      containers:
        - name: ledger
          image: busybox:1.37.0-payments-ledger-2.4.1
          command: ["sh", "-c", "exec sleep 2147483647"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-gateway
  namespace: payments
  labels: {app: payments-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: payments-gateway}}
  template:
    metadata: {labels: {app: payments-gateway}}
    spec:
      containers:
        - name: gateway
          image: busybox:1.37.0
          command: ["sh", "-c", "echo 'payments-gateway 1.9.4 serving on :8080'; exec sleep 2147483647"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
  labels: {app: payments-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments-api}}
  template:
    metadata: {labels: {app: payments-api}}
    spec:
      containers:
        - name: api
          image: busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              echo "payments-api 4.1.0 serving on :8080"
              i=0
              while true; do
                i=$((i + 1))
                user="customer$((i % 50))@example.com"
                now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                echo "$now INFO request id=$i user=$user path=/v1/charges card=4111 1111 1111 1111 status=200 latency_ms=$((i % 90))"
                if [ $((i % 200)) -eq 0 ]; then
                  echo "$now ERROR upstream ledger timeout after 3000ms id=$i user=$user"
                fi
                sleep 0.05
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
