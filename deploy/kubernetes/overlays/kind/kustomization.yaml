# Local Kind: the images are loaded into the node, never pulled. The node needs
# /dev/kvm for the worker's VMs; on macOS that means nested virtualization in the
# Colima VM (`make cluster` checks for it).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: StatefulSet, name: sre-sandbox-payments}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: {kind: StatefulSet, name: sre-harness-payments}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
