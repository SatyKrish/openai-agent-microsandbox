# Local Kind: no Kata, so the pod itself is the outer boundary. The worker runs
# privileged (as a non-root user) because Kind's nested containers mask /proc and
# hide /dev/net/tun, which MXC's Bubblewrap backend needs for each container's
# procfs and its private network. Commands inside MXC containers still run with
# no capabilities, in their own user, PID and network namespaces.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: StatefulSet, name: sre-sandbox-payments}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/privileged
        value: true
      - op: add
        path: /spec/template/spec/containers/0/securityContext/allowPrivilegeEscalation
        value: true
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: {kind: StatefulSet, name: sre-harness-payments}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
