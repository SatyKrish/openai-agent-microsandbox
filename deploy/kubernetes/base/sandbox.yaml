# The MXC sandbox worker for payments. Every command the agent runs starts in its
# own Microsoft eXecution Container (Bubblewrap backend) inside this pod, over the
# conversation's workspace on the PVC. The pod holds the read-only payments
# identity and never the model's API key.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sre-sandbox-payments
  namespace: sre-system
  labels: {app.kubernetes.io/name: sre-sandbox, sre.example.com/domain: payments}
spec:
  serviceName: sre-sandbox-payments
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sre-sandbox, sre.example.com/domain: payments}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sre-sandbox, sre.example.com/domain: payments}
    spec:
      serviceAccountName: payments-sre-sa
      # kubectl in the containers uses this token (bound, rotated by the kubelet).
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: mxc-sandbox-worker:local
          ports:
            - {name: grpc, containerPort: 50051}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: SRE_DOMAIN, value: payments}
            - {name: SRE_NAMESPACES, value: payments}
            - {name: DATA_DIR, value: /sandboxes}
            # Containers may reach the Kubernetes API service and nothing else.
            - {name: MXC_EGRESS, value: kube-api}
            - {name: MXC_TIMEOUT_MS, value: "60000"}
            - {name: MXC_MAX_CONCURRENT, value: "8"}
            - {name: MXC_WORKER_TOKEN_FILE, value: /var/run/secrets/mxc/token}
          securityContext:
            # Bubblewrap needs unprivileged user namespaces and an unmasked /proc for the
            # containers' own procfs; seccomp and AppArmor defaults refuse both. The
            # workload inside each MXC container runs with no capabilities.
            runAsNonRoot: true
            seccompProfile: {type: Unconfined}
            appArmorProfile: {type: Unconfined}
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 3Gi}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 20
          volumeMounts:
            - {name: sandboxes, mountPath: /sandboxes}
            - {name: pair-token, mountPath: /var/run/secrets/mxc, readOnly: true}
      volumes:
        - name: pair-token
          secret: {secretName: sre-payments-pair-token, defaultMode: 0440}
  # The workspaces and the journal survive restarts; no attach delay mid-incident.
  volumeClaimTemplates:
    - metadata: {name: sandboxes}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-sandbox-payments
  namespace: sre-system
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: sre-sandbox, sre.example.com/domain: payments}
  ports:
    - {name: grpc, port: 50051}
