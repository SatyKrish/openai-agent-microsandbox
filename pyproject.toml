# Workspace root: no package of its own. The SDK provider is provider/, the shared
# agent harness (with its UI) is harness/, and the SRE agent in examples/ runs from here.
[tool.uv.workspace]
members = ["provider", "harness"]

[tool.uv.sources]
openai-agent-mxc = { workspace = true }
openai-harness = { workspace = true }

[dependency-groups]
dev = [
    "openai-agent-mxc[tracing]",
    "openai-harness",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["provider/tests", "harness/tests", "examples/sre/evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
extend-exclude = ["provider/src/agent_mxc/proto"]

[tool.ruff.lint]
select = ["E9", "F"]
